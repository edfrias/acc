<?xml version="1.0" encoding="UTF-8"?>
<!--
  Plantilla de carnet de soci · Arquers Club Castelldefels
  Formato: CR80 (85,6 × 54 mm) + 3 mm de sangrado por lado = 91,6 × 60 mm
  Unidades: 1 unidad del viewBox = 1 mm. Corte en (3,3) → (88,6, 57).

  CONTRATO DE LA PLANTILLA (lo que la app lee):
  - <text data-field="..."> : campo variable. El contenido es texto de ejemplo y se sustituye.
      data-field       nombre del campo (se mapea a una columna del CSV)
      data-max-width   ancho máximo en mm; si no cabe, se reduce la fuente
      data-min-size    tamaño mínimo de fuente en mm; si ni así cabe → error de validación
      text-anchor      alineación (start | middle | end)
  - Campos fijos por temporada (data-static="true") se editan en la app, no vienen del CSV.
  - #guides : guías de corte y zona segura. La app las elimina antes de generar el PDF.
  - #logo   : marcador de posición. Sustituir por el logotipo oficial del club.
  - Fuente: la app debe incrustar el TTF de la familia indicada (Inter, licencia OFL).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="91.6mm" height="60mm" viewBox="0 0 91.6 60" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .t { font-family: Inter, 'Helvetica Neue', Arial, sans-serif; }
      .label { font-size: 2.2px; font-weight: 600; letter-spacing: 0.25px; fill: #64748b; }
    </style>
    <clipPath id="clip-bleed"><rect width="91.6" height="60"/></clipPath>
  </defs>

  <g id="background" clip-path="url(#clip-bleed)">
    <rect width="91.6" height="60" fill="#ffffff"/>
    <!-- Diana decorativa (sale del corte, por eso llega al sangrado) -->
    <g opacity="0.07" fill="none" stroke="#2563eb" stroke-width="2.4">
      <circle cx="84" cy="52" r="6"/>
      <circle cx="84" cy="52" r="12"/>
      <circle cx="84" cy="52" r="18"/>
      <circle cx="84" cy="52" r="24"/>
    </g>
    <!-- Banda superior -->
    <rect width="91.6" height="18" fill="#2563eb"/>
    <rect y="18" width="91.6" height="0.8" fill="#facc15"/>
  </g>

  <g id="header" class="t">
    <text x="7" y="10" font-size="3.1" font-weight="800" fill="#ffffff" letter-spacing="0">ARQUERS CLUB CASTELLDEFELS</text>
    <text x="7" y="14.4" font-size="2.4" font-weight="500" fill="#dbeafe" letter-spacing="0.3">CARNET DE SOCI</text>
  </g>

  <!-- Marcador de posición del logo: diana genérica -->
  <g id="logo" transform="translate(79.6 10.5)">
    <circle r="5.2" fill="#ffffff"/>
    <circle r="4.3" fill="#1e293b"/>
    <circle r="3.4" fill="#38bdf8"/>
    <circle r="2.5" fill="#ef4444"/>
    <circle r="1.5" fill="#facc15"/>
    <circle r="0.5" fill="#1e293b"/>
  </g>

  <g id="fields" class="t">
    <text class="label" x="7" y="25">NOM</text>
    <text id="nombre" data-field="nombre" data-max-width="70" data-min-size="2.8"
          x="7" y="30.5" font-size="4.4" font-weight="700" fill="#0f172a" text-anchor="start">Nom Cognom Cognom</text>

    <text class="label" x="7" y="37">NÚM. FEDERAT</text>
    <text id="num_federado" data-field="num_federado" data-max-width="40" data-min-size="3.5"
          x="7" y="42.5" font-size="4.4" font-weight="700" fill="#2563eb" text-anchor="start"
          font-variant-numeric="tabular-nums">000000</text>

    <text class="label" x="7" y="48">TEMPORADA</text>
    <text id="temporada" data-field="temporada" data-static="true" data-max-width="30" data-min-size="2.4"
          x="7" y="52.3" font-size="3" font-weight="600" fill="#0f172a" text-anchor="start">2026-27</text>
  </g>

  <!-- Guías: no se imprimen, la app elimina este grupo -->
  <g id="guides" display="none" fill="none" stroke-width="0.15">
    <rect x="3" y="3" width="85.6" height="54" rx="3.18" stroke="#ef4444"/>
    <rect x="6" y="6" width="79.6" height="48" stroke="#22c55e" stroke-dasharray="1 0.6"/>
  </g>
</svg>
